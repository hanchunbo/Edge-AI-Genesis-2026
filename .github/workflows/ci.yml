name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 libopencv-dev

      - name: Configure CMake
        run: cmake -B build -DCMAKE_CXX_COMPILER=g++-13

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format-21
        run: |
          curl -fsSL https://apt.llvm.org/llvm.sh | sudo bash -s -- 21
          sudo apt-get install -y clang-format-21

      - name: Check code formatting
        run: |
          find 01_Linux_CPP_Foundations -name "*.cpp" -o -name "*.hpp" \
            | xargs clang-format-21 --dry-run --Werror
